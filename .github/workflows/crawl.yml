# Manual operations only: connectivity checks and one-off backfills.
# The unattended daily pipeline lives in daily.yml.
name: crawl

on:
  workflow_dispatch:
    inputs:
      check_r2:
        description: "Run the R2 connectivity check"
        type: boolean
        default: true
      check_db:
        description: "Run the database connectivity check"
        type: boolean
        default: true
      check_rls:
        description: "Run the tenant isolation test (T22)"
        type: boolean
        default: false
      check_console:
        description: "Replay every console path against the live DB under RLS"
        type: boolean
        default: false
      enrich_batch:
        description: "Summarise this many un-summarised changes (blank = none)"
        type: string
        default: ""
      send_alerts_dry_run:
        description: "Render the T26 alert emails from live data without sending"
        type: boolean
        default: false
      backfill_626:
        description: "Backfill all tracked instruments (T14)"
        type: boolean
        default: false
      build_corpus:
        description: "Parse stored documents into sections and compute deltas"
        type: boolean
        default: false
      migration:
        description: "Migration to apply, e.g. 0003_tenant_app (blank = none)"
        type: string
        default: ""

env:
  # Not a secret: the account id appears in every dashboard URL and in the S3 endpoint.
  R2_ACCOUNT_ID: 453137188783dc5aaf71b39099f195ba
  R2_BUCKET: clausewatch-raw

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        working-directory: ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: R2 connectivity check
        if: github.event_name == 'workflow_dispatch' && inputs.check_r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/check_r2.py
      - name: Database connectivity check
        if: github.event_name == 'workflow_dispatch' && inputs.check_db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_db.py
      - name: Tenant isolation test (T22)
        if: github.event_name == 'workflow_dispatch' && inputs.check_rls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/test_rls_isolation.py
      - name: Apply migration
        if: github.event_name == 'workflow_dispatch' && inputs.migration != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/apply_migration.py "${{ inputs.migration }}"
      - name: Summarise material changes
        if: github.event_name == 'workflow_dispatch' && inputs.enrich_batch != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENRICH_BATCH: ${{ inputs.enrich_batch }}
        run: python scripts/enrich.py
      - name: Alert email dry run (T26)
        if: github.event_name == 'workflow_dispatch' && inputs.send_alerts_dry_run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/send_alerts.py --dry-run
      - name: Console end-to-end verification
        if: github.event_name == 'workflow_dispatch' && inputs.check_console
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/verify_console.py
      - name: Backfill all tracked instruments (T14)
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_626
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/backfill_all.py
      - name: Build corpus (sections + deltas)
        if: github.event_name == 'workflow_dispatch' && inputs.build_corpus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/build_corpus.py
