# Daily crawl. Two jobs it does once real (T12/T27):
#   1. fetch MAS instruments, diff new versions, write deltas
#   2. keep the Supabase free project from pausing (~7-day idle → pause; a daily
#      touch prevents it — brief §4.2)
# Until the full crawler is wired up, this verifies R2 connectivity so a credential
# problem surfaces on demand rather than at 09:17 SGT.
name: crawl

on:
  schedule:
    - cron: "17 1 * * *" # 01:17 UTC daily (~09:17 SGT), off-peak, avoids the top of the hour
  workflow_dispatch:
    inputs:
      check_r2:
        description: "Run the R2 connectivity check"
        type: boolean
        default: true
      check_db:
        description: "Run the database connectivity check"
        type: boolean
        default: true
      backfill_626:
        description: "Backfill all tracked instruments (T14)"
        type: boolean
        default: false
      build_corpus:
        description: "Parse stored documents into sections and compute deltas"
        type: boolean
        default: false

env:
  # Not a secret: the account id appears in every dashboard URL and in the S3 endpoint.
  R2_ACCOUNT_ID: 453137188783dc5aaf71b39099f195ba
  R2_BUCKET: clausewatch-raw

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        working-directory: ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: R2 connectivity check
        if: github.event_name == 'workflow_dispatch' && inputs.check_r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/check_r2.py
      - name: Database connectivity check
        if: github.event_name == 'workflow_dispatch' && inputs.check_db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_db.py
      - name: Backfill all tracked instruments (T14)
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_626
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/backfill_all.py
      - name: Build corpus (sections + deltas)
        if: github.event_name == 'workflow_dispatch' && inputs.build_corpus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/build_corpus.py
      - name: Crawl (placeholder until the daily pipeline lands — T27)
        if: github.event_name == 'schedule'
        run: echo "daily crawl not yet wired end to end — see backlog T27"
