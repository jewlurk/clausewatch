# Builds the public changelog page from the corpus and publishes it.
#
# GitHub Pages rather than Cloudflare Pages for now: Pages needs no additional
# credentials (GITHUB_TOKEN is automatic), so the demo can ship without waiting on
# another API token. Moving to Cloudflare Pages later is a deploy-step change only —
# the generated HTML is static and self-contained.
name: demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        working-directory: ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build page
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_demo.py
      # Plain artifact first, so the page is reviewable even before Pages is enabled
      # on the repo (enabling it needs repo-owner rights).
      - uses: actions/upload-artifact@v4
        with:
          name: demo-page
          path: web/
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
