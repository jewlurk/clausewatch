[project]
name = "mas-delta-ingest"
version = "0.1.0"
description = "MAS regulatory delta engine — crawler, parser, differ"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pdfminer.six>=20240706",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawler*", "parse*", "diff*", "enrich*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
